<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кейс — FOA · Family of Artists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=92">
</head>
<body>

<header class="header">
  <div class="header__inner">
    <a href="index.html" class="logo">FOA</a>
    <nav class="nav">
      <a href="projects.html">ПРОЕКТЫ</a>
      <a href="index.html#about">О НАС</a>
      <a href="index.html#services">УСЛУГИ</a>
      <a href="index.html#contacts">КОНТАКТЫ</a>
    </nav>
    <a href="index.html#cta" class="btn btn--orange">Обсудить проект</a>
  </div>
</header>

<section class="case" id="caseRoot">
  <div class="section__inner">
    <div class="case__nav">
      <a href="index.html" class="link-more">← На главную</a>
      <a href="projects.html" class="link-more">← Все проекты</a>
    </div>

    <div id="caseBody"></div>
  </div>
</section>

<footer class="footer" id="contacts">
  <div class="footer__inner">
    <div class="footer__brand">
      <span class="footer__logo" data-admin-trigger>FOA</span>
      <span class="footer__sub">FAMILY OF ARTISTS</span>
    </div>
    <div class="footer__links">
      <a href="tel:+79965115890">+7 (996) 511-58-90</a>
      <a href="mailto:familyofart@gmail.com">familyofart@gmail.com</a>
      <a href="https://t.me/blue_vlvt" target="_blank" rel="noopener">TG — Алина</a>
      <a href="https://t.me/ramcy_graffiti" target="_blank" rel="noopener">TG — Виталий</a>
      <a href="https://taplink.cc/graffitipro" target="_blank" rel="noopener">Taplink</a>
    </div>
    <div class="footer__geo">
      <span class="footer__city">Москва <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 13L13 3M13 3H5M13 3v8" stroke="currentColor" stroke-width="2"/></svg></span>
      <span class="footer__geo-sub">работаем по всему миру</span>
    </div>
  </div>
</footer>

<script src="js/store.js"></script>
<script src="js/site.js"></script>
<script>
(async function () {
  var id = new URLSearchParams(location.search).get('id');
  var p = await FOAStore.get(id);
  var body = document.getElementById('caseBody');

  if (!p) {
    body.innerHTML = '<h2 class="h-big">Проект не найден</h2><p style="margin-top:20px"><a class="link-more" href="projects.html">← Все проекты</a></p>';
    return;
  }

  document.title = p.title + ' — FOA · Family of Artists';

  var gallery = '';
  for (var i = 0; i < p.photos.length; i++) {
    gallery += '<button class="case__shot" data-src="' + p.photos[i] + '"><img src="' + p.photos[i] + '" alt="' + p.title + ' — фото ' + (i + 1) + '" loading="lazy"></button>';
  }

  body.innerHTML =
    '<div class="case__head">' +
      '<h1 class="h-giant">' + p.title + '</h1>' +
      '<span class="case__cat">' + p.category + '</span>' +
    '</div>' +
    '<div class="case__cover"><img src="' + p.cover + '" alt="' + p.title + ' — обложка"></div>' +
    '<p class="case__text">' + p.description + '</p>' +
    '<div class="case__gallery">' + gallery + '</div>';

  body.addEventListener('click', function (e) {
    var btn = e.target.closest('.case__shot');
    if (btn) FOAlightbox(btn.dataset.src);
  });
  var cover = body.querySelector('.case__cover');
  cover.style.cursor = 'zoom-in';
  cover.addEventListener('click', function () { FOAlightbox(p.cover); });
})();
</script>

</body>
</html>
