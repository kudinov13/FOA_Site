<script>
document.addEventListener('DOMContentLoaded', async function () {
  var id = new URLSearchParams(location.search).get('id');
  var p = await FOAStore.get(id);
  var body = document.getElementById('caseBody');

  if (!p) {
    body.innerHTML = '<h2 class="h-big">Проект не найден</h2><p style="margin-top:20px"><a class="link-more" href="projects.html">← Все проекты</a></p>';
    return;
  }

  document.title = p.title + ' — роспись от художников FOA';

  var absCover = /^https?:/.test(p.cover) ? p.cover : 'https://xn--b1adcfkmkkhey0az1hzb.xn--p1ai/' + p.cover;
  var pageUrl = 'https://xn--b1adcfkmkkhey0az1hzb.xn--p1ai/project.html?id=' + encodeURIComponent(id);
  var desc = (p.description || '').replace(/\s+/g, ' ').slice(0, 160);
  var meta = function (sel, attr, val) {
    var el = document.querySelector(sel);
    if (el) el.setAttribute(attr, val);
  };
  meta('meta[name="description"]', 'content', desc);
  meta('link[rel="canonical"]', 'href', pageUrl);
  meta('meta[property="og:title"]', 'content', p.title + ' — роспись от художников FOA');
  meta('meta[property="og:description"]', 'content', desc);
  meta('meta[property="og:url"]', 'content', pageUrl);
  meta('meta[property="og:image"]', 'content', absCover);

  var ld = document.createElement('script');
  ld.type = 'application/ld+json';
  ld.textContent = JSON.stringify({
    '@context': 'https://schema.org',
    '@type': 'CreativeWork',
    'name': p.title,
    'description': p.description,
    'image': absCover,
    'url': pageUrl,
    'genre': p.category,
    'inLanguage': 'ru',
    'creator': { '@type': 'ProfessionalService', 'name': 'FOA — Family of Artists', 'url': 'https://xn--b1adcfkmkkhey0az1hzb.xn--p1ai/' }
  });
  document.head.appendChild(ld);

  var esc = function (s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
  var gallery = '';
  for (var i = 0; i < p.photos.length; i++) {
    gallery += '<button class="case__shot" data-src="' + p.photos[i] + '"><img src="' + p.photos[i] + '" alt="' + p.title + ' — фото ' + (i + 1) + '" loading="lazy"></button>';
  }
  var descHtml = esc(p.description).split(/\n+/).filter(function (s) { return s.trim(); })
    .map(function (s) { return '<p class="case__text">' + s.trim() + '</p>'; }).join('');

  body.innerHTML =
    '<div class="case__head">' +
      '<h1 class="h-giant">' + p.title + '</h1>' +
      '<span class="case__cat">' + p.category + '</span>' +
    '</div>' +
    '<div class="case__cover"><img src="' + p.cover + '" alt="' + p.title + ' — обложка"></div>' +
    descHtml +
    '<div class="case__gallery">' + gallery + '</div>';

  body.addEventListener('click', function (e) {
    var btn = e.target.closest('.case__shot');
    if (btn) FOAlightbox(btn.dataset.src);
  });
  var cover = body.querySelector('.case__cover');
  cover.style.cursor = 'zoom-in';
  cover.addEventListener('click', function () { FOAlightbox(p.cover); });
});
</script>
