<script src="js/store.js"></script>
<script src="js/site.js"></script>
<script>
(async function () {
  var STEP = 6;
  var projects = await FOAStore.all();
  var shown = 0;
  var grid = document.getElementById('projectsGrid');
  var moreWrap = document.getElementById('moreWrap');
  var moreBtn = document.getElementById('moreBtn');

  function renderBatch() {
    var total = projects.length;
    var next = Math.min(shown + STEP, total);
    var html = '';
    for (var i = shown; i < next; i++) html += FOAcard(projects[i], i, total);
    grid.insertAdjacentHTML('beforeend', html);
    shown = next;
    if (shown >= total) moreWrap.style.display = 'none';
  }

  moreBtn.addEventListener('click', renderBatch);
  renderBatch();
})();
</script>
